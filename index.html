<html lang="es">
<head>

  <title>¿Quieres ser mi Caballero?</title>
  
  <!-- WhatsApp / OpenGraph Meta Tags -->
  <meta property="og:title" content="¡Tienes una invitación especial! ✉️" />
  <meta property="og:description" content="Abre este sobre especial para descubrir tu mensaje." />

  <!-- Google Fonts fallback to system fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d0b14;
      --accent-color: #ff3b00;
      --gold: #ffd700;
      --purple-glow: rgba(138, 43, 226, 0.4);
      --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Animated Background */
    .bg-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, #2a1b4e 0%, #120e24 60%, #08060f 100%);
      z-index: 1;
    }

    .bg-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(147, 51, 234, 0.3) 50%, transparent 70%);
      filter: blur(40px);
      -webkit-filter: blur(40px);
      animation: pulseGlow 4s infinite alternate ease-in-out;
      -webkit-animation: pulseGlow 4s infinite alternate ease-in-out;
      z-index: 2;
      pointer-events: none;
    }

    @-webkit-keyframes pulseGlow {
      0% { -webkit-transform: scale(0.9); transform: scale(0.9); opacity: 0.6; }
      100% { -webkit-transform: scale(1.25); transform: scale(1.25); opacity: 0.95; }
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.25); opacity: 0.95; }
    }

    /* Canvas for Sparkles & Particles */
    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Main Container */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      perspective: 1000px;
      -webkit-perspective: 1000px;
    }

    /* Envelope / Pack Stage */
    .pack-wrapper {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      width: 100%;
    }

    .pack-img-container {
      position: relative;
      width: 260px;
      max-width: 78vw;
      filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.4));
      -webkit-filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.4));
      animation: floatPack 3s ease-in-out infinite;
      -webkit-animation: floatPack 3s ease-in-out infinite;
      transition: transform 0.3s ease, filter 0.3s ease;
      -webkit-transition: -webkit-transform 0.3s ease, -webkit-filter 0.3s ease;
    }

    .pack-img-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

    @-webkit-keyframes floatPack {
      0%, 100% { -webkit-transform: translateY(0) rotate(0deg); transform: translateY(0) rotate(0deg); }
      50% { -webkit-transform: translateY(-10px) rotate(1deg); transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatPack {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    /* Shake Animation during opening */
    .shake {
      animation: packShake 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite !important;
      -webkit-animation: packShake 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite !important;
    }

    @-webkit-keyframes packShake {
      0% { -webkit-transform: translate(0, 0) rotate(0deg) scale(1.02); transform: translate(0, 0) rotate(0deg) scale(1.02); }
      15% { -webkit-transform: translate(-8px, -5px) rotate(-4deg) scale(1.05); transform: translate(-8px, -5px) rotate(-4deg) scale(1.05); }
      30% { -webkit-transform: translate(8px, 4px) rotate(4deg) scale(1.07); transform: translate(8px, 4px) rotate(4deg) scale(1.07); }
      45% { -webkit-transform: translate(-10px, 5px) rotate(-5deg) scale(1.1); transform: translate(-10px, 5px) rotate(-5deg) scale(1.1); }
      60% { -webkit-transform: translate(10px, -4px) rotate(5deg) scale(1.12); transform: translate(10px, -4px) rotate(5deg) scale(1.12); }
      75% { -webkit-transform: translate(-6px, -6px) rotate(-3deg) scale(1.15); transform: translate(-6px, -6px) rotate(-3deg) scale(1.15); }
      90% { -webkit-transform: translate(6px, 3px) rotate(3deg) scale(1.18); transform: translate(6px, 3px) rotate(3deg) scale(1.18); }
      100% { -webkit-transform: translate(0, 0) rotate(0deg) scale(1.2); transform: translate(0, 0) rotate(0deg) scale(1.2); }
    }
    @keyframes packShake {
      0% { transform: translate(0, 0) rotate(0deg) scale(1.02); }
      15% { transform: translate(-8px, -5px) rotate(-4deg) scale(1.05); }
      30% { transform: translate(8px, 4px) rotate(4deg) scale(1.07); }
      45% { transform: translate(-10px, 5px) rotate(-5deg) scale(1.1); }
      60% { transform: translate(10px, -4px) rotate(5deg) scale(1.12); }
      75% { transform: translate(-6px, -6px) rotate(-3deg) scale(1.15); }
      90% { transform: translate(6px, 3px) rotate(3deg) scale(1.18); }
      100% { transform: translate(0, 0) rotate(0deg) scale(1.2); }
    }

    /* Burst animation */
    .pack-disappear {
      animation: packBurst 0.6s ease-out forwards;
      -webkit-animation: packBurst 0.6s ease-out forwards;
    }

    @-webkit-keyframes packBurst {
      0% { opacity: 1; -webkit-transform: scale(1.2) rotate(0deg); transform: scale(1.2) rotate(0deg); -webkit-filter: brightness(1.5) blur(0px); filter: brightness(1.5) blur(0px); }
      50% { opacity: 0.8; -webkit-transform: scale(1.4) rotate(5deg); transform: scale(1.4) rotate(5deg); -webkit-filter: brightness(3) blur(4px); filter: brightness(3) blur(4px); }
      100% { opacity: 0; -webkit-transform: scale(1.8) rotate(-10deg); transform: scale(1.8) rotate(-10deg); -webkit-filter: brightness(5) blur(12px); filter: brightness(5) blur(12px); display: none; }
    }
    @keyframes packBurst {
      0% { opacity: 1; transform: scale(1.2) rotate(0deg); filter: brightness(1.5) blur(0px); }
      50% { opacity: 0.8; transform: scale(1.4) rotate(5deg); filter: brightness(3) blur(4px); }
      100% { opacity: 0; transform: scale(1.8) rotate(-10deg); filter: brightness(5) blur(12px); display: none; }
    }

    /* Abrir Button */
    .btn-abrir {
      margin-top: 30px;
      padding: 16px 48px;
      font-family: var(--font-family);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(255, 65, 108, 0.45), 0 0 15px rgba(255, 75, 43, 0.4);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 15;
      touch-action: manipulation;
    }

    .btn-abrir:hover, .btn-abrir:active {
      transform: scale(1.06) translateY(-2px);
      -webkit-transform: scale(1.06) translateY(-2px);
      box-shadow: 0 15px 30px rgba(255, 65, 108, 0.6), 0 0 25px rgba(255, 215, 0, 0.6);
    }

    .btn-abrir::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.4) 50%, transparent 70%);
      transform: rotate(30deg);
      -webkit-transform: rotate(30deg);
      animation: btnShine 3s infinite;
      -webkit-animation: btnShine 3s infinite;
    }

    @-webkit-keyframes btnShine {
      0% { -webkit-transform: translate(-100%, -100%) rotate(30deg); transform: translate(-100%, -100%) rotate(30deg); }
      20%, 100% { -webkit-transform: translate(100%, 100%) rotate(30deg); transform: translate(100%, 100%) rotate(30deg); }
    }
    @keyframes btnShine {
      0% { transform: translate(-100%, -100%) rotate(30deg); }
      20%, 100% { transform: translate(100%, 100%) rotate(30deg); }
    }

    /* Card Reveal Stage */
    .card-reveal-wrapper {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.3) rotateY(180deg);
      -webkit-transform: scale(0.3) rotateY(180deg);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
      width: 100%;
    }

    .card-reveal-wrapper.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) rotateY(0deg);
      -webkit-transform: scale(1) rotateY(0deg);
    }

    .card-container {
      position: relative;
      width: 250px;
      max-width: 72vw;
      border-radius: 18px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 215, 0, 0.35);
      overflow: hidden;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      -webkit-transition: -webkit-transform 0.15s ease-out;
    }

    .card-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      object-fit: contain;
    }

    /* Holographic Shine Overlay on Card */
    .card-holo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: linear-gradient(
        115deg, 
        transparent 20%, 
        rgba(255, 255, 255, 0.25) 40%, 
        rgba(255, 215, 0, 0.3) 50%, 
        rgba(0, 229, 255, 0.25) 60%, 
        transparent 80%
      );
      mix-blend-mode: color-dodge;
      pointer-events: none;
      opacity: 0.7;
      transition: opacity 0.3s ease;
      background-size: 200% 200%;
      animation: holoMove 4s ease infinite alternate;
      -webkit-animation: holoMove 4s ease infinite alternate;
    }

    @-webkit-keyframes holoMove {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }
    @keyframes holoMove {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* Badge Header */
    .reward-badge {
      margin-bottom: 12px;
      padding: 6px 18px;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.5);
      border-radius: 30px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
      animation: badgePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s both;
      -webkit-animation: badgePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s both;
    }

    /* Emotional Invitation Card Text */
    .invitation-text-box {
      margin-top: 14px;
      padding: 12px 18px;
      background: rgba(26, 22, 43, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      max-width: 290px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.8s ease 0.5s both;
      -webkit-animation: fadeIn 0.8s ease 0.5s both;
    }

    .invitation-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .invitation-desc {
      font-size: 0.9rem;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    @-webkit-keyframes badgePop {
      0% { -webkit-transform: translateY(-20px) scale(0.8); transform: translateY(-20px) scale(0.8); opacity: 0; }
      100% { -webkit-transform: translateY(0) scale(1); transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes badgePop {
      0% { transform: translateY(-20px) scale(0.8); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Action Buttons after reveal */
    .post-reveal-actions {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 290px;
      animation: fadeIn 0.8s ease 0.8s both;
      -webkit-animation: fadeIn 0.8s ease 0.8s both;
    }

    .btn-accept {
      width: 100%;
      padding: 12px 24px;
      font-family: var(--font-family);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
      cursor: pointer;
      transition: all 0.25s ease;
      touch-action: manipulation;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-accept:hover, .btn-accept:active {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 25px rgba(16, 185, 129, 0.6);
    }

    .btn-secondary {
      padding: 8px 18px;
      font-family: var(--font-family);
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 30px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.25s ease;
      touch-action: manipulation;
    }

    .btn-secondary:hover, .btn-secondary:active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    @-webkit-keyframes fadeIn {
      from { opacity: 0; -webkit-transform: translateY(15px); transform: translateY(15px); }
      to { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flash Overlay */
    .flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #ffffff 0%, rgba(255, 215, 0, 0.8) 50%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }

    .flash-active {
      animation: flashAnim 0.7s ease-out forwards;
      -webkit-animation: flashAnim 0.7s ease-out forwards;
    }

    @-webkit-keyframes flashAnim {
      0% { opacity: 0; }
      20% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    @keyframes flashAnim {
      0% { opacity: 0; }
      20% { opacity: 0.95; }
      100% { opacity: 0; }
    }
  </style>
</head>

  <script>
    // --- Web Audio API Safe Playback ---
    let audioCtx = null;

    function playSound(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext && !audioCtx) {
          audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx || audioCtx.state !== 'running') return;

        const now = audioCtx.currentTime;

        if (type === 'shake') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(60, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.6);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.6);
        } else if (type === 'pop') {
          const frequencies = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          frequencies.forEach(function(freq, idx) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.2, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.6);
          });
        }
      } catch (e) {
        // Ignore audio errors on restricted webviews
      }
    }

    // --- DOM Elements ---
    const btnAbrir = document.getElementById('btn-abrir');
    const packStage = document.getElementById('pack-stage');
    const packContainer = document.getElementById('pack-container');
    const cardStage = document.getElementById('card-stage');
    const card3D = document.getElementById('card-3d');
    const cardHolo = document.getElementById('card-holo');
    const btnReiniciar = document.getElementById('btn-reiniciar');
    const flashOverlay = document.getElementById('flash');

    // --- Particle System (Confetti & Sparkles) ---
    let canvas, ctx;
    let particles = [];

    try {
      canvas = document.getElementById('particles-canvas');
      if (canvas) {
        ctx = canvas.getContext('2d');
      }
    } catch (e) {}

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth || document.documentElement.clientWidth || 360;
      canvas.height = window.innerHeight || document.documentElement.clientHeight || 640;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function Particle(x, y, isExplosion) {
      this.x = x;
      this.y = y;
      this.size = isExplosion ? Math.random() * 8 + 4 : Math.random() * 4 + 1;
      this.speedX = isExplosion ? (Math.random() - 0.5) * 16 : (Math.random() - 0.5) * 2;
      this.speedY = isExplosion ? (Math.random() - 0.7) * 16 : -Math.random() * 3 - 1;
      this.gravity = isExplosion ? 0.3 : 0.02;
      this.rotation = Math.random() * 360;
      this.rotationSpeed = (Math.random() - 0.5) * 10;
      
      const colors = ['#ffd700', '#ff3b00', '#ff007f', '#00e5ff', '#ffffff', '#a855f7'];
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.opacity = 1;
      this.fade = isExplosion ? Math.random() * 0.015 + 0.01 : Math.random() * 0.005 + 0.002;
      this.shape = Math.random() > 0.5 ? 'circle' : 'rect';
    }

    Particle.prototype.update = function() {
      this.speedY += this.gravity;
      this.x += this.speedX;
      this.y += this.speedY;
      this.opacity -= this.fade;
      this.rotation += this.rotationSpeed;
    };

    Particle.prototype.draw = function() {
      if (!ctx || this.opacity <= 0) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate((this.rotation * Math.PI) / 180);
      ctx.globalAlpha = Math.max(0, this.opacity);
      ctx.fillStyle = this.color;

      if (this.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 1.5);
      }
      ctx.restore();
    };

    function initAmbientParticles() {
      try {
        const w = (canvas && canvas.width) ? canvas.width : 360;
        const h = (canvas && canvas.height) ? canvas.height : 640;
        for (let i = 0; i < 25; i++) {
          particles.push(new Particle(Math.random() * w, Math.random() * h, false));
        }
      } catch (e) {}
    }

    function createExplosion(x, y, count) {
      try {
        for (let i = 0; i < (count || 120); i++) {
          particles.push(new Particle(x, y, true));
        }
      } catch (e) {}
    }

    function animateParticles() {
      try {
        if (ctx && canvas) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();

            if (particles[i].opacity <= 0) {
              particles.splice(i, 1);
            }
          }

          if (particles.length < 20) {
            particles.push(new Particle(Math.random() * canvas.width, canvas.height + 10, false));
          }
        }
      } catch (e) {}

      if (window.requestAnimationFrame) {
        requestAnimationFrame(animateParticles);
      }
    }

    initAmbientParticles();
    animateParticles();

    // --- Opening Sequence ---
    let isOpening = false;

    function abrirSobre(e) {
      if (isOpening) return;
      isOpening = true;

      const btn = document.getElementById('btn-abrir');
      const pack = document.getElementById('pack-container');
      const pStage = document.getElementById('pack-stage');
      const cStage = document.getElementById('card-stage');
      const flash = document.getElementById('flash');

      if (btn) {
        btn.style.opacity = '0';
        btn.style.transform = 'scale(0.8)';
        btn.style.pointerEvents = 'none';
      }

      if (pack) {
        pack.classList.add('shake');
      }

      playSound('shake');

      setTimeout(function() {
        playSound('pop');

        if (flash) {
          flash.classList.add('flash-active');
        }

        try {
          const cx = (canvas && canvas.width) ? canvas.width / 2 : window.innerWidth / 2;
          const cy = (canvas && canvas.height) ? canvas.height / 2 : window.innerHeight / 2;
          createExplosion(cx, cy, 140);
        } catch (e) {}

        if (pack) {
          pack.classList.remove('shake');
          pack.classList.add('pack-disappear');
        }

        setTimeout(function() {
          if (pStage) pStage.style.display = 'none';
          if (cStage) cStage.classList.add('active');
        }, 350);

      }, 700);
    }

    // --- RSVP Confirmation Fireworks ---
    function confirmarAceptacion(e) {
      if (e) e.preventDefault();
      playSound('pop');
      try {
        const cx = (canvas && canvas.width) ? canvas.width / 2 : window.innerWidth / 2;
        const cy = (canvas && canvas.height) ? canvas.height / 2 : window.innerHeight / 2;
        createExplosion(cx, cy - 100, 200);
      } catch (err) {}

      const badge = document.querySelector('.reward-badge');
      if (badge) {
        badge.innerHTML = '🥂 ¡NOS VEMOS EN EL GRAN DÍA! 🥂';
        badge.style.background = 'rgba(16, 185, 129, 0.25)';
        badge.style.borderColor = '#10b981';
        badge.style.color = '#34d399';
      }
    }

    // --- Reset Flow ---
    function reiniciarFlow(e) {
      isOpening = false;
      const pStage = document.getElementById('pack-stage');
      const cStage = document.getElementById('card-stage');
      const flash = document.getElementById('flash');
      const btn = document.getElementById('btn-abrir');
      const pack = document.getElementById('pack-container');

      if (cStage) cStage.classList.remove('active');
      if (flash) flash.classList.remove('flash-active');

      setTimeout(function() {
        if (pStage) pStage.style.display = 'flex';
        if (pack) {
          pack.classList.remove('pack-disappear');
          pack.style.opacity = '1';
          pack.style.transform = 'scale(1)';
        }
        if (btn) {
          btn.style.opacity = '1';
          btn.style.transform = 'scale(1)';
          btn.style.pointerEvents = 'auto';
        }
      }, 400);
    }

    // --- 3D Interactive Card Tilt ---
    function handleMove(e) {
      if (!cardStage || !cardStage.classList.contains('active') || !card3D) return;

      try {
        const rect = card3D.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
        const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;

        const rotateX = ((clientY - centerY) / (rect.height / 2)) * -18;
        const rotateY = ((clientX - centerX) / (rect.width / 2)) * 18;

        card3D.style.transform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.04, 1.04, 1.04)';
        card3D.style.webkitTransform = 'perspective(1000px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.04, 1.04, 1.04)';

        if (cardHolo) {
          const holoX = ((clientX - rect.left) / rect.width) * 100;
          const holoY = ((clientY - rect.top) / rect.height) * 100;
          cardHolo.style.backgroundPosition = holoX + '% ' + holoY + '%';
        }
      } catch (err) {}
    }

    function resetTilt() {
      if (!card3D) return;
      card3D.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      card3D.style.webkitTransform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
    }

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseleave', resetTilt);
    window.addEventListener('touchmove', handleMove, { passive: true });
    window.addEventListener('touchend', resetTilt);
  </script>
</body>
</html>
